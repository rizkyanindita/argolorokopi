<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="./image-slot.js"></script>
  <style>
    body { margin: 0; background: #0b0b0a; }
    a { color: inherit; text-decoration: none; }
    @keyframes kenburns { 0% { transform: scale(1); } 100% { transform: scale(1.12); } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</helmet>

<section style="position:relative;width:100%;height:100vh;min-height:640px;overflow:hidden;font-family:'Inter',sans-serif;background:#141210;">

  <sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
    <div style="position:absolute;inset:0;opacity:{{s.opacity}};transition:opacity 1.2s ease;z-index:0;overflow:hidden;">
      <div style="position:absolute;inset:0;animation:kenburns 22s ease-in-out infinite alternate;animation-delay:{{s.kbDelay}};">
        <image-slot id="bg-{{s.id}}" shape="rect" placeholder="{{s.placeholder}}"></image-slot>
      </div>
    </div>
  </sc-for>

  <div style="position:absolute;inset:0;z-index:1;background:linear-gradient(180deg, rgba(10,9,8,0.15) 0%, rgba(10,9,8,0.35) 45%, rgba(8,7,6,0.88) 100%);pointer-events:none;"></div>

  <div style="position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 24px 72px;box-sizing:border-box;gap:20px;">

    <div style="font-family:'Inter',sans-serif;font-weight:600;font-size:14px;letter-spacing:0.22em;color:{{accent}};text-transform:uppercase;animation:fadeUp 0.8s ease-out 0.1s both;">
      Argo Loro Kopi
    </div>

    <h1 style="margin:0;font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(32px,5.6vw,64px);line-height:1.08;color:oklch(0.98 0.005 90);text-shadow:0 2px 24px rgba(0,0,0,0.35);max-width:20ch;animation:fadeUp 0.9s ease-out 0.25s both;">
      ⛰ Coffee Between The Mountains 🏔
    </h1>

    <p style="margin:0;font-family:'Inter',sans-serif;font-weight:600;font-size:clamp(16px,2vw,20px);line-height:1.5;letter-spacing:0.02em;color:{{accent}};animation:fadeUp 0.9s ease-out 0.4s both;">
      🕘 Open Daily · 9AM – 9PM
    </p>

    <a href="{{wa}}" target="_blank" rel="noopener" style="margin-top:12px;display:inline-flex;align-items:center;gap:10px;background:{{accent}};color:#1a1208;font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;padding:16px 32px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,0.3);animation:fadeUp 0.9s ease-out 0.55s both;" style-hover="filter:brightness(1.08);">
      Reserve via WhatsApp
    </a>

    <div style="display:flex;gap:10px;margin-top:20px;animation:fadeUp 0.9s ease-out 0.7s both;">
      <sc-for list="{{slides}}" as="s" hint-placeholder-count="3">
        <button onClick="{{s.onClick}}" aria-label="Go to slide {{s.id}}" style="width:9px;height:9px;border-radius:50%;border:none;padding:0;cursor:pointer;background:{{s.dotBg}};transform:scale({{s.dotScale}});transition:all 0.3s ease;"></button>
      </sc-for>
    </div>

  </div>
</section>

<div style="background:#141210;border-top:1px solid rgba(255,255,255,0.08);padding:18px 24px;display:flex;justify-content:center;align-items:center;font-family:'Inter',sans-serif;">
  <a href="{{mapsLink}}" target="_blank" rel="noopener" style="color:{{accent}};font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;" style-hover="text-decoration:underline;">📍 Get Directions — Selo, Boyolali</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900},
  &quot;accentColor&quot;: {&quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#E08A3E&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#E08A3E&quot;, &quot;#D97706&quot;, &quot;#C2410C&quot;]},
  &quot;whatsappLink&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://wa.me/6281328256724&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;mapsLink&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;https://maps.app.goo.gl/bcYDaJoT8vpgFmes9&quot;, &quot;tsType&quot;: &quot;string&quot;},
  &quot;autoplayMs&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 5500, &quot;min&quot;: 3000, &quot;max&quot;: 9000, &quot;step&quot;: 500, &quot;tsType&quot;: &quot;number&quot;}
}">
class Component extends DCLogic {
  state = { active: 0 };

  componentDidMount() {
    this._timer = setInterval(() => {
      this.setState(s => ({ active: (s.active + 1) % 3 }));
    }, this.props.autoplayMs ?? 5500);
  }

  componentWillUnmount() {
    clearInterval(this._timer);
  }

  renderVals() {
    const accent = this.props.accentColor ?? '#E08A3E';
    const wa = this.props.whatsappLink ?? 'https://wa.me/6281328256724';
    const mapsLink = this.props.mapsLink ?? 'https://maps.app.goo.gl/bcYDaJoT8vpgFmes9';
    const captions = ['Storefront photo', 'Mountain view photo', 'Coffee bar interior photo'];
    const slides = [0, 1, 2].map(i => ({
      id: i,
      placeholder: captions[i],
      opacity: i === this.state.active ? 1 : 0,
      dotBg: i === this.state.active ? accent : 'rgba(255,255,255,0.4)',
      dotScale: i === this.state.active ? 1.3 : 1,
      kbDelay: `${i * -6}s`,
      onClick: () => this.setState({ active: i })
    }));
    return { accent, wa, mapsLink, slides };
  }
}

</script>
</body>
</html>
